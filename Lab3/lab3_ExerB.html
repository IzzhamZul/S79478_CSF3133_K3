
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ticket Booking</title>
</head>
<body>

<!--
Error 1 (Line 1): Missing "html" in DOCTYPE.
Error 2 (Line 9): Incorrect nesting of span and h1.
Error 3 (Line 11): span used for block content; changed to div.
Error 4 (Line 13): Missing semicolon in &amp; and incorrect < symbol.
Error 5 (Line 14): Ticket calculation adds strings instead of numbers.
Error 6 (Line 18): Typo "emial"; changed to email and added required.
Error 7 (Line 22): Incorrect datalist reference.
Error 8 (Line 23): Datalist ID does not match the input list.
Error 9 (Line 32): Range slider min and max are reversed.
Error 10 (Line 33): Incorrect output for attribute.
Error 11 (Line 38): Incorrect copyright entity &Copy;.
Error 12: Extra closing body and html tags at the end.
-->

<!-- Header Section -->
<div id="header">
    <h1>e-Ticket <span>Your Campus Cinema</span></h1>
</div>

<!-- Main Content Section -->
<div id="content">

    <h2>Book Your Ticket</h2>

    <p>Promotion: tickets &lt; RM10 for students &amp; staff!</p>

    <!-- Ticket Booking Form -->
    <form action="#" method="post"
          oninput="total.value =
          Number(adult.value) + Number(child.value)">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name"
               required autofocus>
        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email"
               required>
        <br><br>

        <label for="date">Show date:</label>
        <input type="date" id="date" name="date">
        <br><br>

        <label for="movie">Movie:</label>
        <input id="movie" name="movie" list="movielist">
        <br>

        <!-- Movie Suggestions -->
        <datalist id="movielist">
            <option value="Space Rangers">
            <option value="Kampung Comedy">
        </datalist>
        <br><br>

        <label for="adult">Adult tickets:</label>
        <input type="number" id="adult" name="adult"
               min="0" value="0">
        <br><br>

        <label for="child">Child tickets:</label>
        <input type="number" id="child" name="child"
               min="0" value="0">
        <br><br>

        <!-- Rating Slider -->
        <label for="rating">Rate our service:</label>
        <input type="range" id="rating" name="rating"
               min="1" max="5" step="1" value="3">
        <br><br>

        <!-- Total Ticket Calculation -->
        Total tickets:
        <output name="total" for="adult child">0</output>
        <br><br>

        <input type="submit" value="Book Now">

    </form>

</div>

<!-- Footer Section -->
<div id="footer">
    <p>&copy; 2026 CineKampus. All rights reserved.</p>
</div>

</body>
</html>
